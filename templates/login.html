<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · บัญชีรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: #f5f6f8; color: #111827; font-family: "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif; font-size: 14px;
  }
  .card {
    width: 100%; max-width: 380px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
    padding: 32px 28px; box-shadow: 0 12px 32px rgba(17, 24, 39, 0.08);
  }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 12px; background: #111827; color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 20px; margin-bottom: 18px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .subtitle { color: #6b7280; font-size: 13px; margin: 4px 0 22px; }
  .error { background: #fdeeec; color: #c8372d; border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin: 0 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; margin-bottom: 14px; outline: none;
  }
  input:focus { border-color: #2f5bd3; box-shadow: 0 0 0 3px #eef2fd; }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: #2f5bd3; color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  button:hover { background: #2449b0; }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="brand-mark">฿</div>
  <h1>บัญชีรายจ่าย</h1>
  <div class="subtitle">เข้าสู่ระบบเพื่อดูรายการและรายงาน</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">เข้าสู่ระบบ</button>
</form>
</body>
</html>
